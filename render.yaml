services:
  - type: web
    name: mentalbridge
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATA_FILE
        value: /var/data/mentalbridge.json
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
    disk:
      name: mentalbridge-data
      mountPath: /var/data
      sizeGB: 1
